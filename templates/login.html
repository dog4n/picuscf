{% extends "base.html" %}{% block title %}Giriş{% endblock %}{% block mainclass %}center{% endblock %}
{% block body %}
<form method="post" class="card narrow">
  <h1>Picus × Cloudflare</h1><p class="muted">WAF Platformu</p>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Kullanıcı adı<input name="username" autocomplete="username" required autofocus></label>
  <label>Şifre<input name="password" type="password" autocomplete="current-password" required></label>
  <button class="btn primary">Giriş</button>
</form>
{% endblock %}

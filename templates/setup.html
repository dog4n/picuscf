{% extends "base.html" %}{% block title %}İlk kurulum{% endblock %}{% block mainclass %}center{% endblock %}
{% block body %}
<form method="post" class="card narrow">
  <h1>İlk kurulum</h1><p class="muted">İlk yönetici hesabını oluşturun.</p>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Kullanıcı adı<input name="username" required pattern="[A-Za-z0-9._\-]{3,32}"></label>
  <label>Şifre (en az 10 karakter)<input name="password" type="password" minlength="10" required></label>
  <label>Şifre tekrar<input name="password2" type="password" minlength="10" required></label>
  <button class="btn primary">Oluştur</button>
</form>
{% endblock %}

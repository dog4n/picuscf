{% extends "base.html" %}{% block title %}Şifre{% endblock %}
{% block body %}
<form method="post" class="card narrow">
  <h1>Şifre değiştir</h1>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Mevcut şifre<input name="current" type="password" required></label>
  <label>Yeni şifre (en az 10 karakter)<input name="new" type="password" minlength="10" required></label>
  <label>Yeni şifre tekrar<input name="new2" type="password" minlength="10" required></label>
  <button class="btn primary">Kaydet</button>
</form>
{% endblock %}
